[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emipredict"
version = "0.1.0"
description = "EMI Prediction MLOps Pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pytest",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["src"]